# -----------------------------------------------------------------------
# Proyecto IoT/MQTT
# Colocar este archivo en: infra/nginx/conf.d/mqtt.conf
#
#   http://IP/mqtt/       -> SPA Angular (iot-frontend:80)
#   http://IP/mqtt/api/   -> FastAPI HTTP (iot-backend:8000)
#   http://IP/mqtt/ws/    -> FastAPI WebSocket (iot-backend:8000)
#   http://IP/mqttapi/    -> FastAPI directo (Swagger / curl)
# -----------------------------------------------------------------------

map $http_upgrade $connection_upgrade_mqtt {
    default  upgrade;
    ''       close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # Redireccion de cortesia
    location = /mqtt  { return 301 /mqtt/; }
    location = /mqttapi { return 301 /mqttapi/; }

    # WebSocket: va ANTES que /mqtt/api/ para mayor claridad
    location /mqtt/ws/ {
        proxy_pass         http://iot-backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade_mqtt;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # API HTTP
    location /mqtt/api/ {
        proxy_pass         http://iot-backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_set_header   X-Forwarded-Prefix /mqtt/api;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Frontend SPA
    location /mqtt/ {
        proxy_pass         http://iot-frontend:80;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
    }

    # Backend directo (Swagger / depuracion)
    location /mqttapi/ {
        proxy_pass         http://iot-backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_set_header   X-Forwarded-Prefix /mqttapi;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
