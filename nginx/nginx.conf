# =========================================================================
# Nginx del proyecto IoT MQTT (iot-nginx).
# Recibe trafico de nginx-general y enruta internamente.
#
# resolver 127.0.0.11: DNS interno de Docker, resuelve upstreams por
# request (no al arrancar) para tolerar reinicios de contenedores.
#
# Regla clave del frontend: se quita el prefijo /mqtt/ antes de pasar
# al contenedor frontend, porque el bundle Angular esta en la raiz del
# servidor nginx del frontend (/usr/share/nginx/html/), no en un
# subdirectorio /mqtt/.
# =========================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s;

    client_max_body_size 20m;
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    location = /mqtt {
        return 301 /mqtt/;
    }

    # ------------------------------------------------------------------
    # 1) WebSocket: /mqtt/ws/{device_id} -> backend:8000/ws/{device_id}
    # ------------------------------------------------------------------
    location /mqtt/ws/ {
        set $upstream_backend backend;
        rewrite ^/mqtt/ws/(.*)$ /ws/$1 break;
        proxy_pass http://$upstream_backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ------------------------------------------------------------------
    # 2) API HTTP: /mqtt/api/... -> backend:8000/...
    # ------------------------------------------------------------------
    location /mqtt/api/ {
        set $upstream_backend backend;
        rewrite ^/mqtt/api/(.*)$ /$1 break;
        proxy_pass http://$upstream_backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /mqtt/api;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ------------------------------------------------------------------
    # 3) Frontend SPA: /mqtt/... -> frontend:80/...
    #    Se quita /mqtt/ para que nginx del frontend encuentre los
    #    archivos en /usr/share/nginx/html/ (no en /mqtt/ subdirectorio)
    # ------------------------------------------------------------------
    location /mqtt/ {
        set $upstream_frontend frontend;
        rewrite ^/mqtt/(.*)$ /$1 break;
        proxy_pass http://$upstream_frontend:80;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # 4) Backend directo: /mqttapi/... -> backend:8000/... (Swagger/debug)
    # ------------------------------------------------------------------
    location = /mqttapi {
        return 301 /mqttapi/;
    }

    location /mqttapi/ {
        set $upstream_backend backend;
        rewrite ^/mqttapi/(.*)$ /$1 break;
        proxy_pass http://$upstream_backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /mqttapi;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = / {
        return 301 /mqtt/;
    }
}
