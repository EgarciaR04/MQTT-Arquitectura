# =========================================================================
# Nginx centralizado (reverse proxy por path).
# Sin dominio: se accede por http://IP_SERVIDOR/<path>
#
#   http://IP/mqtt/         -> SPA Angular (contenedor frontend, estaticos)
#   http://IP/mqtt/api/     -> backend FastAPI (HTTP)
#   http://IP/mqtt/ws/      -> backend FastAPI (WebSocket)
#   http://IP/mqttapi/      -> backend FastAPI directo (Swagger / curl / pruebas)
#
# El frontend Angular se compila con --base-href /mqtt/ y llama a rutas
# RELATIVAS (api, ws) que el navegador resuelve como /mqtt/api y /mqtt/ws.
# =========================================================================

# Mapa para el upgrade de WebSocket: si llega cabecera Upgrade la propaga,
# si no, manda "close". Asi un mismo proxy sirve HTTP normal y WebSocket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Tamano de subida y logs
    client_max_body_size 20m;
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ---------------------------------------------------------------------
    # Redireccion de cortesia: /mqtt -> /mqtt/
    # (sin la barra final, el SPA y el base-href no resuelven bien)
    # ---------------------------------------------------------------------
    location = /mqtt {
        return 301 /mqtt/;
    }

    # ---------------------------------------------------------------------
    # 1) WebSocket:  /mqtt/ws/  ->  backend:8000/ws/
    #    Debe ir ANTES de /mqtt/ porque Nginx elige por prefijo mas largo,
    #    pero lo dejamos explicito para mayor claridad.
    #    El backend define el endpoint como /ws/{device_id}, por eso el
    #    proxy_pass termina en /ws/ (se quita el prefijo /mqtt).
    # ---------------------------------------------------------------------
    location /mqtt/ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;

        # Cabeceras criticas para el upgrade del protocolo WebSocket
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Conexiones largas: sin timeout efectivo
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ---------------------------------------------------------------------
    # 2) API HTTP:  /mqtt/api/  ->  backend:8000/
    #    El backend tiene root_path="/api"; sus rutas internas son
    #    /auth/login, /devices, etc. Nginx quita "/mqtt/api" y deja "/...".
    #    El backend recibe /auth/login y responde correctamente.
    # ---------------------------------------------------------------------
    location /mqtt/api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Informa a FastAPI del prefijo publico para que Swagger/redirects
        # generen URLs correctas cuando se entra por este camino.
        proxy_set_header X-Forwarded-Prefix /mqtt/api;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ---------------------------------------------------------------------
    # 3) Frontend SPA:  /mqtt/  ->  contenedor frontend (estaticos)
    #    El contenedor frontend ya NO hace proxy; solo sirve archivos.
    #    Mantenemos el prefijo /mqtt/ al pasar al frontend porque el bundle
    #    de Angular tiene base-href /mqtt/ y pide /mqtt/main-xxxx.js etc.
    # ---------------------------------------------------------------------
    location /mqtt/ {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------------------------
    # 4) (Opcional) Backend directo:  /mqttapi/  ->  backend:8000/
    #    Util para abrir Swagger en http://IP/mqttapi/docs o probar con curl.
    #    NO lo usa el frontend; es una entrada de administracion/depuracion.
    # ---------------------------------------------------------------------
    location = /mqttapi {
        return 301 /mqttapi/;
    }

    location /mqttapi/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /mqttapi;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ---------------------------------------------------------------------
    # Raiz: redirige a la app para evitar un 404 pelado en http://IP/
    # ---------------------------------------------------------------------
    location = / {
        return 301 /mqtt/;
    }
}
