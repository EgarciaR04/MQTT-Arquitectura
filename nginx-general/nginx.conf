# =========================================================================
# Nginx general (reverse proxy por path).
# Usa resolver de Docker (127.0.0.11) para resolver upstreams en cada
# request, no al arrancar. Esto permite que nginx-general inicie aunque
# iot-nginx o compi-nginx no esten corriendo todavia.
# =========================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # DNS interno de Docker: resuelve nombres de contenedores en cada request
    resolver 127.0.0.11 valid=10s;

    client_max_body_size 20m;
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    location = / {
        return 301 /mqtt/;
    }

    location = /mqtt {
        return 301 /mqtt/;
    }

    location = /compi {
        return 301 /compi/;
    }

    # -----------------------------------------------------------------
    # Proyecto IoT MQTT -> iot-nginx
    # Sin URI en proxy_pass: el path completo (/mqtt/...) se reenvía
    # tal cual a iot-nginx, que ya tiene sus propios location blocks.
    # -----------------------------------------------------------------
    location /mqtt/ {
        set $upstream_mqtt iot-nginx;
        proxy_pass         http://$upstream_mqtt;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location = /mqttapi {
        return 301 /mqttapi/;
    }

    location /mqttapi/ {
        set $upstream_mqtt iot-nginx;
        proxy_pass         http://$upstream_mqtt;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # -----------------------------------------------------------------
    # Proyecto Compi -> compi-nginx (retorna 503 si no esta corriendo)
    # -----------------------------------------------------------------
    location /compi/ {
        set $upstream_compi compi-nginx;
        proxy_pass         http://$upstream_compi;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
